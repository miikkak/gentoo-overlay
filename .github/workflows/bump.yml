---
name: Version Bump

on: # yamllint disable-line rule:truthy
  schedule:
    # Every day at 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package to bump (all runs every bump script)
        type: choice
        options: [all, alloy, beszel, bun, rcon-cli, mc-conn-poller]
        default: all
      version:
        description: Upstream version to bump to (needs a single package; default is the latest release)
        type: string
        default: ""

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump ${{ matrix.package }}
    runs-on: ["self-hosted", "linux", "x64"]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [alloy, beszel, bun, rcon-cli, mc-conn-poller]
    env:
      PACKAGE: ${{ matrix.package }}
      INPUT_PACKAGE: ${{ inputs.package }}
      INPUT_VERSION: ${{ inputs.version }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PULL_REQUEST_TOKEN || github.token }}

      - name: Bump ebuilds
        id: bump
        env:
          # Distfile release upload (beszel, Go packages) only needs contents: write
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          selected="${INPUT_PACKAGE:-all}"
          if [[ -n "${INPUT_VERSION}" && "${selected}" == all ]]; then
            echo "::error::A version needs a single package; set the package input instead of 'all'"
            exit 1
          fi
          if [[ "${selected}" != all && "${selected}" != "${PACKAGE}" ]]; then
            echo "${PACKAGE} not selected (${selected})"
            echo "bumped=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version=""
          if [[ "${selected}" == "${PACKAGE}" ]]; then
            version="${INPUT_VERSION}"
          fi
          case "${PACKAGE}" in
            alloy | rcon-cli | mc-conn-poller) cmd=(scripts/go-bump.sh "${PACKAGE}") ;;
            *) cmd=("scripts/${PACKAGE}-bump.sh") ;;
          esac
          echo "script=${cmd[*]}" >> "${GITHUB_OUTPUT}"
          out="$("${cmd[@]}" ${version:+"${version}"} | tee /dev/stderr | grep '^bumped=')"
          echo "${out}" >> "${GITHUB_OUTPUT}"

      - name: Open draft PR
        if: steps.bump.outputs.bumped != ''
        env:
          # A PAT is needed so the PR triggers the required checks
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN || github.token }}
          VERSION: ${{ steps.bump.outputs.bumped }}
          SCRIPT: ${{ steps.bump.outputs.script }}
        run: |
          set -Eeuo pipefail
          branch="auto-update/${PACKAGE}-${VERSION}"
          if [[ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]]; then
            echo "PR for ${branch} already open"
            exit 0
          fi
          git switch -c "${branch}"
          git add -A .
          git commit -m "chore(${PACKAGE}): bump to ${VERSION}" \
            -m "Automated version bump. Ebuilds and Manifests are regenerated by ${SCRIPT}."
          git push origin "${branch}"
          gh pr create --draft --base main --head "${branch}" \
            --title "chore(${PACKAGE}): bump to ${VERSION}" \
            --label "release:none" \
            --body "Automated bump of \`${PACKAGE}\` to ${VERSION} by \`${SCRIPT}\`.

          - [ ] \`emerge -1av\` verified on a binary host
          - [ ] upstream release notes reviewed for config or flag changes"
